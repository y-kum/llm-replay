[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "llm-replay"
version = "0.1.0"
description = "Record LLM calls once, replay them in tests and CI: deterministic, free, with prompt-drift and cost reports."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yash Kumawat" }]
keywords = ["llm", "testing", "pytest", "openai", "anthropic", "gemini", "evaluation", "llmops", "replay", "vcr"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Pytest",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.40"]
gemini = ["google-genai>=1.0"]
all = ["openai>=1.40", "anthropic>=0.40", "google-genai>=1.0"]
dev = ["openai>=1.40", "anthropic>=0.40", "google-genai>=1.0", "httpx>=0.27", "pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/y-kum/llm-replay"
Issues = "https://github.com/y-kum/llm-replay/issues"

[project.scripts]
llm-replay = "llm_replay.cli:main"

[project.entry-points.pytest11]
llm_replay = "llm_replay.pytest_plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_replay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E731"]
